name: Verify Macro Mint

on:
  push:
    branches:
      - main
      - feat/mobile-precision-and-beta-20261103
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@10
      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify beta-auth migration and Edge syntax
        run: node scripts/check-auth-activation-sources.mjs
      - name: Check one-shot Edge release contracts
        run: node scripts/check-edge-release.mjs
      - name: Verify guarded postdeploy security test harness
        run: node --check scripts/live-auth-security-audit.mjs
      - name: Exercise bounded Edge JSON decoding
        run: node scripts/check-edge-json-reader.mjs
      - name: Exercise Edge handler negative paths without network
        run: node scripts/check-edge-negative-paths.mjs
      - name: Exercise successful enrollment and one-use recovery without network
        run: node scripts/check-auth-positive-paths.mjs
      - name: Guard modular app and bundle architecture
        run: node scripts/check-internal-architecture.mjs
      - name: Nutrition regression tests
        run: pnpm test
      - name: ESLint (existing Prettier violations excluded)
        run: "pnpm exec eslint . --rule 'prettier/prettier: off'"
      - name: Build and regenerate TanStack route types
        run: pnpm build
      - name: TypeScript
        run: pnpm exec tsc --noEmit

  sql-release-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: macromint_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d macromint_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: macromint_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply release migrations to disposable PostgreSQL
        run: |
          psql -X -v ON_ERROR_STOP=1 -f scripts/sql-release-fixtures.sql
          psql -X -v ON_ERROR_STOP=1 -f drizzle/migrations/0010_ai_scan_atomic_budgets.sql
          psql -X -v ON_ERROR_STOP=1 -f drizzle/migrations/0011_atomic_admin_actions.sql
          psql -X -v ON_ERROR_STOP=1 -f drizzle/migrations/0012_atomic_beta_invites.sql
          psql -X -v ON_ERROR_STOP=1 -f drizzle/migrations/0013_private_settings_read.sql
      - name: Exercise quota, audit, rollback and privileges
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/sql-release-contracts.sql
      - name: Apply and exercise planner SQL on disposable PostgreSQL
        run: |
          psql -X -v ON_ERROR_STOP=1 -f scripts/sql-planner-fixtures.sql
          psql -X -v ON_ERROR_STOP=1 -f drizzle/migrations/0017_planned_meals_goal_days_recipe_edits.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/sql-planner-contracts.sql
