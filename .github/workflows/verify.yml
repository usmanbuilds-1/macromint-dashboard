name: Verify Macro Mint

on:
  push:
    branches:
      - feat/mobile-precision-and-beta-20261103
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@10
      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify beta-auth migration and Edge syntax
        run: node scripts/check-auth-activation-sources.mjs
      - name: Nutrition regression tests
        run: pnpm test
      - name: ESLint (existing Prettier violations excluded)
        run: "pnpm exec eslint . --rule 'prettier/prettier: off'"
      - name: Build and regenerate TanStack route types
        run: pnpm build
      - name: TypeScript
        run: pnpm exec tsc --noEmit
